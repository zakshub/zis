[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zis-core"
version = "0.4.0"
description = "Local-first deterministic ZIS cognitive runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zis = "zis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

